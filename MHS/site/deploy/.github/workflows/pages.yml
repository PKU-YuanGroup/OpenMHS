name: Deploy the OpenMHS site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "MHS/spec/**"
      - "MHS/schema/**"
      - "MHS/registry/**"
      - "MHS/conformance/**"
      - "MHS/sdk/**"
      - "MHS/site/**"
      - "LICENSE"
      - "LICENSE-docs"
      - "NOTICE"
      - "integration/openai4s/DESIGN.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the registry aggregates
        # index.json, index.jsonl and records.csv are git-ignored: generated from MHS/registry/repos, never committed
        run: python3 MHS/registry/build_index.py
      - name: Build the site
        run: >-
          python3 MHS/site/build.py --release
          --site-url "https://mhs.openai4s.org"
          --out "$RUNNER_TEMP/site"
      - name: Verify links, assets and data
        run: >-
          python3 MHS/site/check.py --site "$RUNNER_TEMP/site"
          --site-url "https://mhs.openai4s.org" --fresh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
